[project]
name = "spacecraft-thruster-ml"
version = "0.1.0"
description = "Machine learning models for spacecraft thruster performance degradation prediction"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    {name = "Andrei Griu", email = "andrei.griu1@isa.utm.md"}
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=2.0.0",
    "matplotlib>=3.6.0,<4.0.0",
    "seaborn>=0.13.0,<1.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pyright>=1.1.0",
    "pre-commit>=3.5.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# =============================================================================
# RUFF CONFIGURATION
# =============================================================================

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

# File patterns to include/exclude
include = ["*.py", "*.pyi"]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
    "build",
    "dist",
]

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "NPY",    # numpy-specific rules
    "PD",     # pandas-vet
]

# Disable specific rules
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults
    "B904",   # Within an except clause, raise exceptions with explicit from
    "SIM108", # Use ternary operator (sometimes less readable)
    "ARG002", # Unused method argument (common in interfaces)
    "PD901",  # Avoid using 'df' as variable name (common in data science)
]

# Allow fix for all enabled rules (when `--fix` is provided)
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/**/*.py" = [
    "ARG001",  # Unused function arguments in tests
    "S101",    # Use of assert in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["spacecraft_thruster_ml"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder"
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# =============================================================================
# PYRIGHT CONFIGURATION (Pragmatic for Lab Work)
# =============================================================================

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
venvPath = "."
venv = "venv"

include = ["."]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/venv",
    "**/.pytest_cache",
]

# Balanced type checking - catches real bugs without overwhelming
typeCheckingMode = "basic"

# Critical errors only
reportUndefinedVariable = "error"
reportUnboundVariable = "error"

# Actual problems as warnings
reportMissingImports = "warning"
reportDuplicateImport = "warning"
reportUnusedCoroutine = "warning"
reportGeneralTypeIssues = "warning"

# Disable noisy checks for pandas/numpy heavy code
reportOptionalSubscript = "none"
reportOptionalMemberAccess = "none"
reportOptionalCall = "none"
reportOptionalIterable = "none"
reportOptionalContextManager = "none"
reportOptionalOperand = "none"

# Disable type inference strictness (let pandas/numpy be dynamic)
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportMissingTypeArgument = "none"

# Disable unused warnings (ruff handles this better)
reportUnusedImport = "none"
reportUnusedClass = "none"
reportUnusedFunction = "none"
reportUnusedVariable = "none"

# Keep inference flexible for data science work
strictListInference = false
strictDictionaryInference = false
strictSetInference = false
strictParameterNoneValue = false

# Allow type: ignore comments when needed
enableTypeIgnoreComments = true
